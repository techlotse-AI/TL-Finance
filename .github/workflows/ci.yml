name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # Release from the Actions UI or API: run on `main` with the version to cut.
  # verify → tag (creates the annotated git tag + GitHub Release) → publish,
  # all in this one run. A tag pushed by hand still works exactly as before.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (must equal VERSION)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every push and pull request. This is the gate; nothing publishes
  # unless verify passes.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: tlfinance
          POSTGRES_USER: tlfinance
          POSTGRES_PASSWORD: tlfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tlfinance -d tlfinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tlfinance:tlfinance@localhost:5432/tlfinance?schema=public
      AUDIT_IP_HASH_SECRET: ci-audit-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run version:check
      - run: npm run dependencies:check
      - run: npm run generate
      - run: npm run migration:check
      - run: npm run api:security:check
      - run: npm run v0.4:readiness
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:access
      - run: npm run security:audit
      - run: npm run build
      - run: npm run compose:check
      - run: docker build .
      - run: docker build --target migrator .

  # Release cut from the Actions UI/API (workflow_dispatch on `main`). Runs only
  # after verify passes on the dispatched commit, then creates the annotated
  # `vX.Y.Z` tag and a GitHub Release with the CHANGELOG section as notes.
  # A tag created with the workflow token does not trigger a second CI run,
  # which is why publish runs in this same run (see its `if`).
  tag:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: cut
        name: Create annotated tag and GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_VERSION: "${{ inputs.version }}"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases are cut from main only (dispatched on ${GITHUB_REF})." >&2
            exit 1
          fi
          if ! printf '%s' "${RELEASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "Version must be x.y.z or x.y.z-(alpha|beta|rc).N, received '${RELEASE_VERSION}'." >&2
            exit 1
          fi
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "${file_version}" != "${RELEASE_VERSION}" ]; then
            echo "VERSION file is ${file_version} but ${RELEASE_VERSION} was requested; bump VERSION/package.json first." >&2
            exit 1
          fi
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi
          # Release notes: the CHANGELOG section for this version, else the tag itself.
          awk -v v="${RELEASE_VERSION}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          title="$({ grep -m1 "^## \[${RELEASE_VERSION}\]" CHANGELOG.md || true; } | sed -E 's/^## \[[^]]+\] - [0-9-]+ *(—|-)? *//; s/^"//; s/"$//')"
          [ -n "${title}" ] && title="${tag} — ${title}" || title="${tag}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${title}" -m "See CHANGELOG.md [${RELEASE_VERSION}]."
          git push origin "refs/tags/${tag}"
          prerelease=""
          case "${RELEASE_VERSION}" in *-*) prerelease="--prerelease" ;; esac
          if [ -s release-notes.md ]; then
            gh release create "${tag}" --title "${title}" --notes-file release-notes.md ${prerelease}
          else
            gh release create "${tag}" --title "${title}" --generate-notes ${prerelease}
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  # Single parametric publish job. It only runs on pushes (never PRs) and only
  # after verify succeeds. Tag pushes (vX.Y.Z) publish the versioned image plus
  # `latest`; main pushes publish a `nightly` image plus the commit SHA; a
  # workflow_dispatch release publishes the version it just tagged. All
  # channels are Trivy-scanned and blocked on Critical vulnerabilities.
  publish:
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        (github.event_name == 'push' &&
          (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')) ||
        (github.event_name == 'workflow_dispatch' && needs.tag.result == 'success')
      )
    needs: [verify, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      IMAGE_NAME: techlotse/tl-finance
      MIGRATOR_IMAGE_NAME: techlotse/tl-finance-migrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2

      - id: meta
        name: Resolve publish channel and image tags
        env:
          DISPATCHED_TAG: "${{ needs.tag.outputs.tag }}"
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE}"
          if [ -n "${DISPATCHED_TAG}" ]; then
            # Release cut by the tag job in this run: the tag it created is the
            # source of truth, and GITHUB_SHA is the main commit it points at.
            ref_name="${DISPATCHED_TAG}"
            ref_type="tag"
          fi
          if [ "${ref_type}" = "tag" ]; then
            # Release: tag is the source of truth for the version.
            version="${ref_name#v}"
            case "${version}" in
              *-alpha.*) channel="prerelease"; moving="alpha" ;;
              *-beta.*)  channel="prerelease"; moving="beta" ;;
              *-rc.*)    channel="prerelease"; moving="rc" ;;
              *)         channel="release";    moving="latest" ;;
            esac
            echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            # Versioned image + the moving channel tag: pre-releases move `:alpha`
            # (never `:latest`), stable releases move `:latest`.
            echo "tags=${ref_name} ${moving}" >> "${GITHUB_OUTPUT}"
          else
            # Nightly: built from main, never tagged `latest`.
            short_sha="${GITHUB_SHA:0:12}"
            echo "channel=nightly" >> "${GITHUB_OUTPUT}"
            echo "version=0.0.0-nightly+${short_sha}" >> "${GITHUB_OUTPUT}"
            echo "tags=nightly ${short_sha}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build candidate images
        shell: bash
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --tag "${IMAGE_NAME}:release-candidate" \
            .
          docker build \
            --target migrator \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --tag "${MIGRATOR_IMAGE_NAME}:release-candidate" \
            .

      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:release-candidate"
          format: json
          output: trivy-app-results.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln
          trivyignores: .trivyignore
          exit-code: 0
      - name: Scan migrator image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.MIGRATOR_IMAGE_NAME }}:release-candidate"
          format: json
          output: trivy-migrator-results.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln
          trivyignores: .trivyignore
          exit-code: 0
      - name: Combine container scan reports
        shell: bash
        run: |
          jq -s '{Results: [.[].Results[]]}' \
            trivy-app-results.json \
            trivy-migrator-results.json \
            > trivy-results.json
      - id: vulnerabilities
        name: Prepare vulnerability report
        env:
          RELEASE_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_TAG: "${{ steps.meta.outputs.channel }} ${{ steps.meta.outputs.version }}"
        run: node scripts/report-container-vulnerabilities.mjs trivy-results.json container-vulnerability-report
      # Single, deduplicated tracking issue. If vulnerabilities are present we
      # update the existing open issue in place (refresh its body, append this
      # run's overflow parts) instead of opening a new one each release; only if
      # none is open do we create one. When a scan is clean we close any open
      # tracking issue referencing the clean run.
      - name: Update or create vulnerability issue
        if: steps.vulnerabilities.outputs.total_count != '0'
        env:
          GH_TOKEN: "${{ github.token }}"
          VULN_LABEL: container-vulnerabilities
          ISSUE_TITLE: "Container image vulnerabilities"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SCAN_TAG: "${{ steps.meta.outputs.channel }} ${{ steps.meta.outputs.version }}"
        shell: bash
        run: |
          set -euo pipefail
          gh label create "${VULN_LABEL}" --color B60205 \
            --description "Open container image CVEs from the release scan" --force
          first_report="container-vulnerability-report/part-001.md"
          existing="$(gh issue list --label "${VULN_LABEL}" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            echo "Updating existing issue #${existing} in place."
            gh issue edit "${existing}" --body-file "${first_report}"
            gh issue comment "${existing}" \
              --body "Rescanned for **${SCAN_TAG}** — vulnerabilities still present. See ${RUN_URL}."
            issue_ref="${existing}"
          else
            echo "No open issue; creating one."
            issue_ref="$(gh issue create --label "${VULN_LABEL}" \
              --title "${ISSUE_TITLE}" --body-file "${first_report}")"
          fi
          for report in container-vulnerability-report/part-*.md; do
            if [ "${report}" != "${first_report}" ]; then
              gh issue comment "${issue_ref}" --body-file "${report}"
            fi
          done
      - name: Close vulnerability issue when scan is clean
        if: steps.vulnerabilities.outputs.total_count == '0'
        env:
          GH_TOKEN: "${{ github.token }}"
          VULN_LABEL: container-vulnerabilities
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SCAN_TAG: "${{ steps.meta.outputs.channel }} ${{ steps.meta.outputs.version }}"
        shell: bash
        run: |
          set -euo pipefail
          for number in $(gh issue list --label "${VULN_LABEL}" --state open \
            --json number --jq '.[].number'); do
            echo "Closing resolved issue #${number}."
            gh issue close "${number}" \
              --comment "Resolved: the **${SCAN_TAG}** container scan found no HIGH/CRITICAL vulnerabilities. See ${RUN_URL}."
          done
      - name: Block publish on Critical vulnerabilities
        if: steps.vulnerabilities.outputs.critical_count != '0'
        shell: bash
        run: |
          echo "Container publishing blocked: ${{ steps.vulnerabilities.outputs.critical_count }} Critical vulnerabilities found." >&2
          exit 1

      - name: Sign in to Docker Hub
        shell: bash
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USER }}" --password-stdin
      - name: Tag and push images
        shell: bash
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "Publishing ${IMAGE_NAME}:${tag} and ${MIGRATOR_IMAGE_NAME}:${tag}"
            docker tag "${IMAGE_NAME}:release-candidate" "${IMAGE_NAME}:${tag}"
            docker tag "${MIGRATOR_IMAGE_NAME}:release-candidate" "${MIGRATOR_IMAGE_NAME}:${tag}"
            docker push "${IMAGE_NAME}:${tag}"
            docker push "${MIGRATOR_IMAGE_NAME}:${tag}"
          done
